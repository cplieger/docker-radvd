# Minimal valid radvd config shared by tests/smoke.sh (radvd's configtest
# mode, -c) and scripts/smoke.sh (the running container's config: it relies
# on IgnoreIfMissing on to keep radvd alive with no real interface, and on
# the absence of AdvRASrcAddress for its startup-warning assertion).
interface eth0 {
    AdvSendAdvert on;
    IgnoreIfMissing on;
    prefix 2001:db8::/64 {
        AdvOnLink on;
        AdvAutonomous on;
    };
};
