# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Boots the image on an IPv6-enabled docker network
# with a config that ADVERTISES, then smoke_verify proves a router
# advertisement carrying that config reaches a second container on the same
# network, and ends with a negative control proving a radvd told not to
# advertise puts nothing on the wire while its own liveness probe still passes.
#
# Why a packet rather than a process: the shipped probe is `pidof radvd`, so a
# radvd that runs, stays healthy and advertises nothing passes it. Measured on
# the published image with radvd's own send path failing, the container reports
# running and healthy and its log is indistinguishable from a working emitter,
# because the `sendmsg` and `send_ra_forall failed` lines appear only at
# RADVD_DEBUG_LEVEL=5 and the shipped default is 0. Nothing else in this repo
# observes a packet: the build-time configtest parses a config without running
# the daemon, and scripts/smoke.sh runs every scenario with --network none on
# purpose, so no advertisement is emitted there at all.
#
# Constraints that shape the knobs below:
# - An advertisement needs a link-local address on the advertising interface. On
#   a docker network without IPv6, docker sets
#   net.ipv6.conf.eth0.disable_ipv6=1, eth0 carries no address at all, and radvd
#   runs healthy and silent. So --ipv6 is load-bearing. The subnet is explicit
#   only to pin it: docker would otherwise allocate a ULA /64 derived from its
#   own daemon ID, leaving the prefix below outside this network by chance
#   rather than by construction.
# - The advertised prefix is deliberately not this network's subnet. It exists
#   nowhere but in the generated fixture, so no advertisement from another
#   source on the host can satisfy the assertions below, and radvd advertises a
#   prefix that is absent from the interface without complaint.
# - The fixture is generated rather than committed because the negative control
#   rewrites it. Its location has no bearing on the image: the test stage copies
#   three named files plus tests/shell/, so anything else under tests/ is
#   excluded by construction, these two files included.
# - MinRtrAdvInterval 3 and MaxRtrAdvInterval 4 are radvd's own floor.
#   Unsolicited advertisements then arrive within seconds instead of on the
#   default 200 to 600 second cadence, which is what lets the control assert
#   silence over a bounded window.
SMOKE_APP_NAME=docker-radvd
# The shipped probe is `pidof radvd` behind a 15s start period and the first
# probe succeeds inside it, so this is margin rather than an expected wait.
# shellcheck disable=SC2034  # read by the harness, which sources this file
SMOKE_TIMEOUT=90

# Every object created here carries the app name and this shell's PID, the shape
# the harness uses for its own container, so parallel runs on one host never
# collide.
SMOKE_NET="smoke-${SMOKE_APP_NAME}-net-$$"
SMOKE_SNIFFER="smoke-${SMOKE_APP_NAME}-radvdump-$$"
SMOKE_SNIFFER_NEG="smoke-${SMOKE_APP_NAME}-radvdump-neg-$$"
# Single-sourced: the fixture writer and the assertions below read the same
# values, so an edit to the fixture cannot drift from what the capture is
# checked against.
SMOKE_PREFIX=fd00:5eed:c0de::/64
SMOKE_RDNSS=fd00:5eed:c0de::53
SMOKE_VALID=600
SMOKE_PREFERRED=300
SMOKE_RDNSS_LIFETIME=30
# Seconds the control waits for silence. This is the run's only fixed
# wall-clock cost, because every other wait returns as soon as its evidence
# arrives. Measured on the published image: a receiver started after the reload
# decodes an emitting radvd within 2s, so 10s is that plus two more
# MaxRtrAdvInterval periods.
SMOKE_SILENCE_WAIT=10
SMOKE_FIXTURE=$(mktemp -d)

# Release what this file acquires. The harness EXIT trap calls it after removing
# its own container, and the setup failure path below calls it directly, because
# that trap is armed only after this file is sourced. The network can only go
# once every endpoint on it is gone, and endpoint teardown can lag container
# removal, so the first rm can lose to "network has active endpoints"; the
# failure stays swallowed either way, because cleanup must never change the
# verdict.
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  docker rm -f "$SMOKE_SNIFFER" "$SMOKE_SNIFFER_NEG" >/dev/null 2>&1 || true
  i=0
  while ! docker network rm "$SMOKE_NET" >/dev/null 2>&1 \
    && docker network inspect "$SMOKE_NET" >/dev/null 2>&1 \
    && [ "$i" -lt 5 ]; do
    i=$((i + 1))
    sleep 1
  done
  rm -rf "$SMOKE_FIXTURE"
}

# $1 is the AdvSendAdvert value: `on` for the run under test, `off` for the
# negative control, so the two configs differ in exactly the one directive whose
# effect is being measured.
smoke_write_config() {
  printf '%s\n' \
    'interface eth0 {' \
    "    AdvSendAdvert $1;" \
    '    MinRtrAdvInterval 3;' \
    '    MaxRtrAdvInterval 4;' \
    '    AdvDefaultLifetime 0;' \
    "    prefix $SMOKE_PREFIX {" \
    '        AdvOnLink on;' \
    '        AdvAutonomous on;' \
    "        AdvValidLifetime $SMOKE_VALID;" \
    "        AdvPreferredLifetime $SMOKE_PREFERRED;" \
    '    };' \
    "    RDNSS $SMOKE_RDNSS {" \
    "        AdvRDNSSLifetime $SMOKE_RDNSS_LIFETIME;" \
    '    };' \
    '};' >"$SMOKE_FIXTURE/radvd.conf"
}

# mktemp creates the directory 0700 for the runner's user, and radvd re-reads the
# config as the unprivileged radvd user on every reload, so both have to be
# readable by another uid.
if ! smoke_write_config on \
  || ! chmod 755 "$SMOKE_FIXTURE" \
  || ! chmod 644 "$SMOKE_FIXTURE/radvd.conf" \
  || ! docker network create --ipv6 --subnet fd00:5eed:5:1::/64 "$SMOKE_NET" >/dev/null; then
  printf 'FAIL: could not create the smoke fixture or its IPv6 network %s\n' "$SMOKE_NET" >&2
  smoke_cleanup
  exit 1
fi

# Word-split by the harness; none of these values contains a space. NET_RAW is
# in docker's default capability set, so naming it is explicit rather than
# load-bearing, and the raw ICMPv6 socket is what this run is about. The
# forwarding sysctl is not a precondition for advertising (measured: radvd 2.21
# warns and advertises anyway) and is set so its three forwarding lines stay out
# of the log a failure dumps.
# shellcheck disable=SC2034  # read by the harness, which sources this file
SMOKE_RUN_ARGS="--network ${SMOKE_NET} --cap-add NET_RAW --sysctl net.ipv6.conf.all.forwarding=1 -v ${SMOKE_FIXTURE}:/etc/radvd:ro"

# radvdump is upstream's own advertisement decoder and this image ships it, so
# the receiver IS the image under test and nothing has to be installed on the
# runner. It runs in a second container because radvd sets IPV6_MULTICAST_LOOP
# to 0 on the socket it sends from, so the kernel never loops an advertisement
# back to a listener in the emitter's own network namespace (measured: 0
# advertisements in 8s there against 4 in the same window from a sidecar).
smoke_start_sniffer() {
  docker run -d --name "$1" --network "$SMOKE_NET" --cap-add NET_RAW \
    --entrypoint /usr/sbin/radvdump \
    "$(docker inspect --format '{{ .Config.Image }}' "$SMOKE_CONTAINER")" >/dev/null
}

# Poll: the json-file log driver can lag the writer, so a single grep can miss a
# line radvdump has already written. $2 bounds the wait in seconds.
smoke_wait_for_ra() {
  i=0
  while [ "$i" -lt "$2" ]; do
    if docker logs "$1" 2>&1 | grep -qF -- "prefix $SMOKE_PREFIX"; then
      return 0
    fi
    i=$((i + 1))
    sleep 1
  done
  return 1
}

# Gates on the loop's own reload line rather than the earlier "SIGHUP received"
# one, which is emitted while the old daemon is still alive: radvd's shutdown
# path sends a final advertisement that still carries the prefix, so gating on
# the earlier line would race that packet into the negative capture below.
smoke_reload_count() {
  docker logs "$SMOKE_CONTAINER" 2>&1 \
    | grep -c 'msg="reloading radvd (config re-read via restart)"' || true
}

smoke_verify() {
  # RFC 4861 6.1.2: a host silently discards an advertisement that is not
  # sourced from a link-local address, so the capture below is checked against
  # this interface's own link-local rather than merely being non-empty.
  link_local=$(docker exec "$SMOKE_CONTAINER" ip -6 -o addr show dev eth0 scope link \
    | awk '{ print $4 }' | head -n 1 | cut -d/ -f1)
  case "$link_local" in
    fe80:*) ;;
    *)
      printf 'FAIL: the advertising interface has no link-local address (read "%s"); no advertisement from it could be accepted by any host\n' "$link_local" >&2
      return 1
      ;;
  esac

  smoke_start_sniffer "$SMOKE_SNIFFER"
  if ! smoke_wait_for_ra "$SMOKE_SNIFFER" 20; then
    printf 'FAIL: no router advertisement carrying %s reached a second container on this network within 20s; radvd is running and healthy and advertising nothing\n' "$SMOKE_PREFIX" >&2
    docker logs "$SMOKE_SNIFFER" 2>&1 | tail -20 >&2
    return 1
  fi
  ra=$(docker logs "$SMOKE_SNIFFER" 2>&1)

  # Everything the fixture asked for has to come back out of upstream's own
  # decoder. A directive that stops crossing the wire fails by name here, and
  # none of these is visible to `pidof radvd`. MinRtrAdvInterval and
  # MaxRtrAdvInterval are absent because they are the one pair radvdump cannot
  # recover; AdvSendAdvert is absent because radvdump prints it as a literal in
  # its interface header, so asserting it could never fail.
  for want in \
    "based on Router Advertisement from $link_local" \
    "AdvDefaultLifetime 0;" \
    "AdvOnLink on;" \
    "AdvAutonomous on;" \
    "AdvValidLifetime $SMOKE_VALID;" \
    "AdvPreferredLifetime $SMOKE_PREFERRED;" \
    "RDNSS $SMOKE_RDNSS" \
    "AdvRDNSSLifetime $SMOKE_RDNSS_LIFETIME;"; do
    if ! printf '%s\n' "$ra" | grep -qF -- "$want"; then
      printf 'FAIL: the captured advertisement does not carry "%s"\n' "$want" >&2
      printf '%s\n' "$ra" >&2
      return 1
    fi
  done
  printf 'docker-radvd smoke: an advertisement carrying %s arrived from %s\n' "$SMOKE_PREFIX" "$link_local"

  # Negative control, last because it leaves the container silent. AdvSendAdvert
  # is radvd's own emission switch, so turning it off reproduces exactly the
  # state the healthcheck cannot see and an upstream bump could hand us by
  # accident: the daemon runs, the probe passes, the segment gets nothing.
  # Delivered through the documented in-container reload, which re-reads the
  # config as the radvd user.
  reloads_before=$(smoke_reload_count)
  if ! smoke_write_config off; then
    printf 'FAIL: could not rewrite the fixture for the negative control\n' >&2
    return 1
  fi
  if ! docker exec "$SMOKE_CONTAINER" kill -HUP 1; then
    printf 'FAIL: could not signal the supervisor for the negative control reload\n' >&2
    return 1
  fi
  reloaded=""
  i=0
  while [ "$i" -lt 20 ]; do
    if [ "$(smoke_reload_count)" -gt "$reloads_before" ]; then
      reloaded=1
      break
    fi
    i=$((i + 1))
    sleep 1
  done
  if [ -z "$reloaded" ]; then
    printf 'FAIL: the negative control never reloaded radvd onto the silent config, so it proves nothing\n' >&2
    return 1
  fi

  # A FRESH receiver: joining the network sends a Router Solicitation on
  # link-up, so an emitting radvd answers immediately instead of the wait
  # riding on the unsolicited cadence. Reusing the first sniffer would lose
  # that stimulus and leave the window as the only mechanism.
  smoke_start_sniffer "$SMOKE_SNIFFER_NEG"
  if smoke_wait_for_ra "$SMOKE_SNIFFER_NEG" "$SMOKE_SILENCE_WAIT"; then
    printf 'FAIL: a radvd told not to advertise still put %s on the wire\n' "$SMOKE_PREFIX" >&2
    return 1
  fi
  # An empty capture only means silence if the thing that captured it was alive
  # to hear: radvdump exits on a failed socket open, so a running container is
  # sufficient evidence its socket is live.
  if [ "$(docker inspect --format '{{ .State.Running }}' "$SMOKE_SNIFFER_NEG" 2>/dev/null)" != true ]; then
    printf 'FAIL: the control receiver is not running, so its empty capture proves nothing\n' >&2
    docker logs "$SMOKE_SNIFFER_NEG" 2>&1 | tail -20 >&2
    return 1
  fi
  # Without this the control could pass for the wrong reason, because a crashed
  # daemon is also silent. The probe is run live rather than read from
  # .State.Health: the healthcheck's interval is 30s and this lands inside it,
  # so the cached verdict is still the boot probe, taken before the reload.
  running=$(docker inspect --format '{{ .State.Running }}' "$SMOKE_CONTAINER")
  if [ "$running" != true ] || ! docker exec "$SMOKE_CONTAINER" pidof radvd >/dev/null; then
    printf 'FAIL: the silent radvd is not still running with a live daemon (running=%s), so the control measured a crash rather than silence\n' "$running" >&2
    return 1
  fi
  printf 'docker-radvd smoke: control ok (radvd still running and its probe still passes while nothing is advertised)\n'
}
