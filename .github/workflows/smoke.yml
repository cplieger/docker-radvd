# Repo-local: NOT synced from cplieger/ci, deliberately, so a template sync
# cannot clobber it. tests/shell/ci_contract_test.sh asserts the wiring.
name: Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Build image
        run: docker build -t docker-radvd:smoke .

      - name: Run signal-contract smoke test
        run: scripts/smoke.sh docker-radvd:smoke
