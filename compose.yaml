services:
  radvd:
    image: ghcr.io/cplieger/docker-radvd:latest
    container_name: radvd
    restart: unless-stopped

    # radvd emits IPv6 Router Advertisements onto the LAN, so it needs host
    # networking (or a macvlan) plus the raw-socket capability. NET_ADMIN is
    # optional - only needed for kernel-applied interface-parameter directives
    # (AdvLinkMTU, AdvCurHopLimit, ...); see README.
    network_mode: host
    cap_add:
      - NET_RAW    # required: raw ICMPv6 socket to emit RAs
      - NET_ADMIN  # optional: only for kernel-applied iface params (AdvLinkMTU etc.); drop for pure RA emission

    # Provide your radvd.conf at /etc/radvd/radvd.conf (read-only).
    volumes:
      - ./radvd:/etc/radvd:ro
